name: CommonJS Interop

on:
  pull_request:
    paths:
      - 'cli-tool/package.json'
      - 'cli-tool/package-lock.json'
      - 'cli-tool/scripts/check-cjs-interop.js'
      - '.github/workflows/cjs-interop.yml'
  push:
    branches: [main]
    paths:
      - 'cli-tool/package.json'
      - 'cli-tool/package-lock.json'

jobs:
  interop:
    name: require() contract on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22', '24']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - name: Install
        working-directory: cli-tool
        run: npm ci --no-audit --no-fund
      - name: Verify dependencies load under require()
        working-directory: cli-tool
        run: npm run test:cjs-interop
