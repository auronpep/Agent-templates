name: Dashboard Build

on:
  pull_request:
    paths:
      - 'dashboard/**'
      - '.github/workflows/dashboard-build.yml'

permissions:
  contents: read

jobs:
  build:
    name: astro build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install
        working-directory: dashboard
        run: npm install --no-audit --no-fund
      - name: Build
        working-directory: dashboard
        run: npm run build
