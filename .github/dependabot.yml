version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/cli-tool"
    schedule:
      interval: "weekly"
    groups:
      # One PR per ecosystem for routine minor/patch bumps instead of one per
      # dependency. Majors stay separate so they still get individual review.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  - package-ecosystem: "npm"
    directory: "/dashboard"
    schedule:
      interval: "weekly"
    groups:
      # One PR per ecosystem for routine minor/patch bumps instead of one per
      # dependency. Majors stay separate so they still get individual review.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # One PR per ecosystem for routine minor/patch bumps instead of one per
      # dependency. Majors stay separate so they still get individual review.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    labels:
      - "ci"
